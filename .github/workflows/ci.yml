name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Use the fully open-source (MIT) cache provider — the default "enhanced"
          # provider is a proprietary component under Gradle's separate Terms of Use.
          cache-provider: basic

      - name: Check (tests, Checkstyle, PMD)
        run: ./gradlew check --console=plain

      - name: Build
        run: ./gradlew build --console=plain
