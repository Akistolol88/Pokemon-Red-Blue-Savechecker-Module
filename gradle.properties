# ==============================================================================
# Gradle Performance & Environment Configuration
# ==============================================================================

# Enable ordinary build caching to reuse task outputs across builds (Crucial for CI/CD)
org.gradle.caching=true

# Allow Gradle to execute decoupled modules in parallel (Speeds up multi-project builds)
org.gradle.parallel=true

# Enable background daemon for fast local development feedback loops.
# NOTE: Ensure you append '--no-daemon' in GitLab CI to prevent hanging processes.
org.gradle.daemon=true

# Configuration Cache is disabled by default for student assignments due to strict
# constraints on environment variables and dynamic logic (e.g., deadline checks).
org.gradle.configuration-cache=false

# Optimized JVM memory limits suitable for both local development and standard CI containers.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
