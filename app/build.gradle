plugins {
    // Shared convention plugins for the Java toolchain and static analysis.
    // No testing conventions: the test app is tested manually (see TEST_REPORT.md).
    id 'lnu.java-conventions'
    id 'lnu.quality-conventions'

    // Packages and runs the module as a CLI application.
    id 'application'
}

group = 'se.lnu.cli'
version = '1.0.0'

application {
    mainClass = 'se.lnu.cli.App'
}

dependencies {
    implementation project(':savechecker')
}

// Run the app from the repo root so relative save file paths work as typed.
tasks.named('run') {
    workingDir = rootProject.projectDir
}
